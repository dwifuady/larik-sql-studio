[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
fetch-interval = "24h"

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-DFS-2016", "Unicode-3.0", "Apache-2.0 WITH LLVM-exception", "MIT AND Apache-2.0", "0BSD"]
deny = []
copyleft = "deny"
allow-osi-fsfs-free = "neither"
allow-gnu = false

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
