# https://taskfile.dev

version: '3'

tasks:
  default:
    desc: Show all available tasks
    cmds:
      - task --list-all

  run:
    desc: Run the Tauri application in development mode
    cmds:
      - npm run tauri dev
    silent: true

  build:
    desc: Build the Tauri application
    env:
      # linuxdeploy ships binutils 2.35, whose strip cannot parse .relr.dyn
      # sections in modern system libraries (e.g. Fedora 44). Skip stripping.
      NO_STRIP: "1"
    cmds:
      - npm run tauri build
    silent: true